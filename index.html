<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3352C4">
<title>Tesorería Alfa</title>
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tesorería">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap">
<style>
/* Diseño: app de una columna tipo celular, tarjetas redondeadas, barra de pestañas abajo para tesoreros y guía */
:root{
  --bg:#F4F5FA; --surface:#FFFFFF; --ink:#1C2233; --muted:#646C80; --line:#E3E6EF;
  --brand:#3352C4; --brand-ink:#FFFFFF; --brand-soft:#E6EBFB; --brand-deep:#23398F;
  --sun:#F2B33D; --sun-soft:#FDF1D8;
  --ok:#1E8A55; --ok-soft:#DDF3E7; --warn:#B26A00; --warn-soft:#FCEBCF; --bad:#C23B3B; --bad-soft:#FBE3E3;
  --shadow:0 1px 2px rgba(28,34,51,.05),0 6px 18px rgba(28,34,51,.06);
  --font:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#10131C; --surface:#191E2B; --ink:#E9ECF4; --muted:#A0A8BB; --line:#2A3142;
  --brand:#7D96F0; --brand-ink:#0E1430; --brand-soft:#232D4F; --brand-deep:#5672D9;
  --sun:#F2B33D; --sun-soft:#3A2F17;
  --ok:#5CC98F; --ok-soft:#163626; --warn:#EDAA4E; --warn-soft:#3A2A12; --bad:#EE8080; --bad-soft:#3D1E1E;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:600px;margin:0 auto;padding-block:12px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:16px;height:16px}

/* Encabezado */
.head{display:flex;align-items:center;gap:12px;padding:4px 0}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:900;flex:none}
.avatar.sm{width:36px;height:36px;font-size:.85rem}
.avatar.sun{background:var(--sun);color:#3A2A05}
.head .who{flex:1;min-width:0}
.head .who b{display:block;font-size:1.15rem;font-weight:800;line-height:1.2}
.head .who span{font-size:.85rem;color:var(--muted)}
.iconbtn{border:0;background:var(--surface);box-shadow:var(--shadow);width:42px;height:42px;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}

/* Tarjetas */
.card{background:var(--surface);border-radius:18px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{margin:0;font-size:1.08rem;font-weight:800;display:flex;align-items:center;gap:8px}
.card h2 .ico{color:var(--brand)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)} .small{font-size:.87rem} .tiny{font-size:.78rem}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.debt{color:var(--bad);font-weight:800} .paid{color:var(--ok);font-weight:800}

/* Tarjeta principal */
.hero{background:linear-gradient(140deg,var(--brand) 0%,var(--brand-deep) 100%);color:#fff;border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 24px rgba(51,82,196,.25)}
@media (prefers-color-scheme: dark){.hero{color:#fff;background:linear-gradient(140deg,#3352C4,#23398F)}}
.hero .lbl{font-size:.9rem;opacity:.85;font-weight:600}
.hero .big{font-size:2.6rem;font-weight:900;line-height:1;letter-spacing:-.02em}
.hero .chip{align-self:flex-start;background:rgba(255,255,255,.18);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.88rem;display:flex;gap:6px;align-items:center}
.hero .chip.ok{background:#E6F7EE;color:#14663F} .hero .chip.bad{background:#FFE7E7;color:#9C2727}
.hero .btn{background:#fff;color:#23398F}

/* Botones */
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:800;font-size:1rem;cursor:pointer;background:var(--brand);color:var(--brand-ink);display:inline-flex;gap:8px;align-items:center;justify-content:center;text-decoration:none;min-height:48px}
.btn.block{width:100%}
.btn.soft{background:var(--brand-soft);color:var(--brand)}
.btn.ok{background:var(--ok);color:#fff}
.btn.wa{background:#25A35A;color:#fff}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.ghost{background:transparent;color:var(--brand);padding:8px 10px;min-height:0}
.btn.sm{padding:9px 12px;min-height:40px;font-size:.92rem;border-radius:12px}
.btn[disabled]{opacity:.55;cursor:wait}
.btn:focus-visible,.iconbtn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,.mem:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1 1 auto}

/* Formularios */
label{display:flex;flex-direction:column;gap:6px;font-size:.88rem;color:var(--muted);font-weight:700}
input,select{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px;width:100%;font-size:1rem;color:var(--ink)}
input:focus,select:focus{border-color:var(--brand);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:440px){.grid2{grid-template-columns:1fr}}
.file{border:2px dashed var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);cursor:pointer;text-align:center}
.file.has{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.file input{display:none}
.err{color:var(--bad);font-weight:700;font-size:.92rem}

/* Listas */
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.list>.item:first-child,.list>.mem-wrap:first-child{border-top:0}
.item .l{flex:1;min-width:0}
.item .t{font-weight:800}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--brand-soft);color:var(--brand)}
.ic.sun{background:var(--sun-soft);color:var(--warn)} .ic.ok{background:var(--ok-soft);color:var(--ok)} .ic.bad{background:var(--bad-soft);color:var(--bad)}
.pill{font-size:.75rem;font-weight:800;padding:4px 9px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.neutral{background:var(--brand-soft);color:var(--brand)}
.pill.off{background:var(--line);color:var(--muted)}
.mem-wrap{border-top:1px solid var(--line)}
.mem{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;text-align:left;cursor:pointer;padding:12px 0;color:inherit}
.mem .chev{color:var(--muted);transition:transform .2s}
.mem[aria-expanded="true"] .chev{transform:rotate(180deg)}
.det{display:flex;flex-direction:column;gap:12px;padding:4px 0 18px}
.det h3{font-size:.95rem;font-weight:800;margin:6px 0 0}
.search{position:relative}
.search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:40px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.85rem;cursor:pointer;color:var(--muted)}
.filters button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}

/* Cuotas */
.cuotas{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cuota{border-radius:12px;padding:8px 4px;text-align:center;background:var(--bg);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;font-weight:800;color:var(--muted);text-transform:uppercase}
.cuota .ico{width:16px;height:16px}
.cuota.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.cuota.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.estado{border-radius:14px;padding:12px 14px;font-weight:800;display:flex;gap:10px;align-items:center}
.estado.ok{background:var(--ok-soft);color:var(--ok)} .estado.bad{background:var(--bad-soft);color:var(--bad)} .estado.neutral{background:var(--brand-soft);color:var(--brand)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:440px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}}
.stat{background:var(--bg);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-size:1.1rem;font-weight:900;font-variant-numeric:tabular-nums}
.stat-btn{border:0;text-align:left;cursor:pointer;color:inherit;font:inherit;box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .15s}
.stat-btn .ver{color:var(--brand);font-weight:800}
.stat-btn.on,.stat-btn:hover{box-shadow:inset 0 0 0 1.5px var(--brand)}
.fdet{background:var(--bg);border-radius:14px;padding:4px 12px 8px}
.prog{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.prog span{display:block;height:100%;background:var(--ok);border-radius:99px}

/* KPIs */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-size:1.45rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .k{font-size:.85rem;color:var(--muted);font-weight:700}
.tablewrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:.9rem}
table.t th{text-align:left;color:var(--muted);font-weight:700;font-size:.78rem;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:10px 8px;border-bottom:1px solid var(--line)}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* Pestañas abajo */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:15}
.tabs .in{display:flex;max-width:600px;width:100%}
.tab{flex:1;min-width:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 1px;font-size:.66rem;font-weight:800;color:var(--muted);cursor:pointer;border-radius:12px;position:relative}
.tab[aria-current="page"]{color:var(--brand);background:var(--brand-soft)}
.tab .badge{position:absolute;top:2px;right:calc(50% - 22px);background:var(--bad);color:#fff;border-radius:999px;font-size:.65rem;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}

/* Hoja inferior (formularios) */
.sheet-bg{position:fixed;inset:0;background:rgba(16,19,28,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet .grab{width:44px;height:5px;border-radius:99px;background:var(--line);align-self:center}
.sheet h2{margin:0;font-size:1.2rem;font-weight:900}
.receipt{background:var(--bg);border-radius:14px;padding:14px;font-size:.9rem;white-space:pre-wrap;font-family:inherit}
.check{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-weight:700;color:var(--ink);flex-direction:row;font-size:1rem}
.check input{width:22px;height:22px;flex:none;accent-color:var(--brand)}
.check:first-child{border-top:0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;font-size:.92rem;max-width:90vw;z-index:40;box-shadow:var(--shadow)}
.login{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:18px}
.login .logo{width:64px;height:64px;border-radius:20px;background:var(--brand);color:#fff;display:grid;place-items:center}
.login .logo .ico{width:32px;height:32px}
.login h1{font-size:1.8rem;font-weight:900;margin:0;line-height:1.15;text-wrap:balance}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px;color:var(--muted);text-align:center}
.empty .ic{width:48px;height:48px;border-radius:16px}
.sec-title{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:6px 4px -4px}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:440px){.fgrid{grid-template-columns:1fr 1fr}}
.qrbox{background:#fff;border-radius:18px;padding:14px;align-self:center;width:min(78vw,300px);aspect-ratio:1;display:grid;place-items:center}
.qrbox svg{width:100%;height:100%}
.scan{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:1;width:100%;max-width:420px;align-self:center}
.scan video{width:100%;height:100%;object-fit:cover;display:block}
.scan .mira{position:absolute;inset:14%;border:4px solid rgba(255,255,255,.85);border-radius:22px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.scan.ok .mira{border-color:#3fd68a} .scan.bad .mira{border-color:#ff7a7a}
.ultimo{border-radius:14px;padding:12px 14px;font-weight:800;text-align:center}
.bigpct{font-size:2.6rem;font-weight:900;line-height:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <section id="vCargando"><div class="card"><div class="muted">Cargando…</div></div></section>

  <section id="vLogin" class="login" hidden>
    <img src="logo-alfa.png" alt="Alfa" style="height:64px;width:auto;margin:0 0 4px;display:block">
    <h1>Tesorería Alfa</h1>
    <div class="muted">Entrá con tu DNI. Si abriste tu link personal, entrás directo.</div>
    <div class="card">
      <label>Tu DNI (sin puntos)<input id="inCodigo" autocomplete="off" inputmode="numeric" placeholder="Ej.: 30123456"></label>
      <button class="btn block" id="btnEntrar">Entrar</button>
      <div class="err" id="loginErr" hidden></div>
    </div>
  </section>

  <div id="vMain" hidden></div>
</div>
<nav class="tabs" id="tabs" hidden><div class="in" id="tabsIn"></div></nav>
<div class="toast" id="toast" hidden></div>
<div id="sheetRoot"></div>

async function comprimir(file){
  if(!file.type.startsWith("image/") || /heic|heif/i.test(file.type)) return file;
  try{
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(res => c.toBlob(res, "image/jpeg", 0.65));
    if(!blob || blob.size >= file.size) return file;
    return new File([blob], file.name.replace(/\.\w+$/, "") + ".jpg", {type:"image/jpeg"});
  }catch(_){ return file; }
}

}

async function guardarQR(texto, nombre){
  try{
    const tmp = document.createElement("div"); tmp.innerHTML = qrSVG(texto);
    const svg = tmp.querySelector("svg"); if(!svg) throw new Error("No se pudo generar el QR");
    svg.setAttribute("width","720"); svg.setAttribute("height","720");
    const url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)], {type:"image/svg+xml"}));
    const img = new Image(); await new Promise((ok, mal)=>{ img.onload = ok; img.onerror = mal; img.src = url; });
    const W = 900, H = 1080, c = document.createElement("canvas"); c.width = W; c.height = H; const x = c.getContext("2d");
    x.fillStyle = "#fff"; x.fillRect(0,0,W,H); x.drawImage(img, 90, 90, 720, 720); URL.revokeObjectURL(url);
    x.fillStyle = "#1C2233"; x.textAlign = "center"; x.font = "bold 52px Nunito, Arial, sans-serif"; x.fillText(nombre, W/2, 900);
    x.fillStyle = "#646C80"; x.font = "34px Nunito, Arial, sans-serif"; x.fillText(`QR de asistencia · ${S.data?.parroquia||""}`, W/2, 960);
    const blob = await new Promise(r=>c.toBlob(r, "image/png"));
    const archivo = new File([blob], `QR ${nombre}.png`, {type:"image/png"});
    if(navigator.canShare && navigator.canShare({files:[archivo]})){ try{ await navigator.share({files:[archivo], title:"Mi QR de asistencia"}); return; }catch(e){ if(e.name==="AbortError") return; } }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = archivo.name; document.body.appendChild(a); a.click(); a.remove();
    toast("QR guardado en Descargas");
  }catch(e){ toast("No se pudo guardar. Sacale una captura de pantalla al QR."); }
}

function hojaPago(){

  abrirHoja(`<h2>Informar un pago por transferencia</h2>

  (s, cerrar)=>{

    const calc = ()=>{ const e = ev.find(x=>String(x.id)===selC.value); cantBox.hidden = !e;

    montoI.addEventListener("input", calc);
    selC.onchange = ()=>{ if(!ev.find(x=>String(x.id)===selC.value)) montoI.value=""; calc(); }; cant.oninput = calc;
    const inp = s.querySelector("#pArchivo");
    inp.onchange = ()=>{ const f=inp.files[0]; s.querySelector("#pFileBox").classList.toggle("has",!!f); s.querySelector("#pFileTxt").innerHTML = f?`<b>${esc(f.name)}</b><br><span class="small">Tocá para cambiarlo</span>`:"<b>Tocá para elegir el comprobante</b>"; };
    const btn = s.querySelector("#pEnviar"), err = s.querySelector("#pErr");
    btn.onclick = () => ocupado(btn, async ()=>{
      err.hidden = true;
      try{

    });
  });
}

// ===== Excel =====
async function cargarXLSX(){
  if(window.XLSX) return;
  await new Promise((res, rej)=>{ const sc=document.createElement("script"); sc.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; sc.onload=res; sc.onerror=()=>rej(new Error("No se pudo cargar el generador de Excel. Revisá tu internet.")); document.head.appendChild(sc); });
}
function hojaXLSX(filas, anchos){ const ws = XLSX.utils.aoa_to_sheet(filas); if(anchos) ws["!cols"] = anchos.map(w=>({wch:w})); return ws; }
const fechaArchivo = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const nro = v => Math.round(Number(v)||0);
async function exportarAsistencia(){
  try{
    await cargarXLSX();
    const d = await rpc("export_asistencia",{p_codigo:S.codigo});
    const L = {presente:"P", tarde:"T", servicio:"S", ausente:"A", no_corresponde:"—"};
    const cab = ["Dirigente","Tesorero", ...d.reuniones.map(r=>`${r.fecha.slice(0,5)} ${r.nombre}`), "Presentes","Tardes","Servicio","Faltas","% asistencia","Faltas seguidas"];
    const filas = [[`Asistencia · ${d.parroquia}`],[`Generado el ${d.generado}. P = presente, T = tarde, S = servicio, A = ausente, — = todavía no era dirigente. El % no cuenta los servicios.`],[], cab];
    d.dirigentes.forEach(x=>{ const r = x.resumen, base = r.total - r.servicio;
      filas.push([x.nombre, x.tesorero||"", ...d.reuniones.map(re=>L[x.estados[String(re.id)]]||""), r.presentes, r.tardes, r.servicio, r.ausentes, base>0?Math.round(r.presentes/base*100)/100:"", r.racha]); });
    const ws = hojaXLSX(filas, [24,18, ...d.reuniones.map(()=>14), 10,8,9,8,12,14]);
    const colPct = XLSX.utils.encode_col(2 + d.reuniones.length + 4);
    for(let i=5;i<=filas.length;i++){ const c = ws[`${colPct}${i}`]; if(c && typeof c.v==="number") c.z = "0%"; }
    const ws2 = hojaXLSX([["Fecha","Reunión o evento","Tipo"], ...d.reuniones.map(r=>[r.fecha, r.nombre, r.tipo])], [12,34,22]);
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Asistencia"); XLSX.utils.book_append_sheet(wb, ws2, "Reuniones");
    XLSX.writeFile(wb, `Asistencia ${fechaArchivo()}.xlsx`);
    toast("Excel descargado");
  }catch(e){ toast(e.message); }
}
async function exportarAportes(){
  try{
    await cargarXLSX();
    const d = await rpc("export_aportes",{p_codigo:S.codigo});
    const evs = [...new Set(d.dirigentes.flatMap(x=>x.cuenta.conceptos.filter(c=>c.evento_id!==null).map(c=>c.nombre)))];
    const cab = ["Dirigente","Tesorero","Celular","Mail","Aporte mensual","Compromiso del año","Debería llevar a hoy","Pagado al aporte","De eventos","Falta para el año","Atraso","Estado", ...evs.map(e=>`Debe: ${e}`), "Deuda total hoy"];
    const filas = [[`Aportes · ${d.parroquia}`],[`Generado el ${d.generado}`],[], cab];
    d.dirigentes.forEach(x=>{ const c = x.cuenta, a = c.aporte;
      filas.push([x.nombre, x.tesorero||"", x.celular||"", x.email||"", nro(a.mensual), nro(a.anual), nro(a.debido_a_hoy), nro(a.pagado), nro(a.credito_eventos), nro(a.falta_anio), nro(a.atraso),
        a.al_dia?"Al día":`Debe ${a.cuotas_atrasadas} ${a.cuotas_atrasadas===1?"aporte":"aportes"}`,
        ...evs.map(e=>{ const k = c.conceptos.find(z=>z.nombre===e); return k?nro(k.saldo):0; }), nro(c.saldo)]); });
    const ws = hojaXLSX(filas, [24,18,14,22,12,14,14,14,11,14,10,16, ...evs.map(()=>16), 14]);
    const money = new Set([4,5,6,7,8,9,10, ...evs.map((_,i)=>12+i), 12+evs.length]);
    for(let i=5;i<=filas.length;i++) money.forEach(ci=>{ const cell = ws[`${XLSX.utils.encode_col(ci)}${i}`]; if(cell && typeof cell.v==="number") cell.z = '"$" #,##0'; });
    const pg = [["Fecha","Recibo","Dirigente","Concepto","Medio","Monto","Suma al aporte"], ...d.pagos.map(p=>[p.fecha, p.recibo, p.dirigente, p.concepto, p.medio, nro(p.monto), nro(p.al_aporte)])];
    const ws2 = hojaXLSX(pg, [12,9,24,24,14,12,14]);
    for(let i=2;i<=pg.length;i++) ["F","G"].forEach(col=>{ const cell = ws2[`${col}${i}`]; if(cell) cell.z = '"$" #,##0'; });
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Estado por dirigente"); XLSX.utils.book_append_sheet(wb, ws2, "Pagos aprobados");
    XLSX.writeFile(wb, `Aportes ${fechaArchivo()}.xlsx`);
    toast("Excel descargado");
  }catch(e){ toast(e.message); }
}

function qrSVG(texto){
  try{ const q = qrcode(0, "M"); q.addData(texto); q.make(); return q.createSvgTag({cellSize:8, margin:2, scalable:true}); }
  catch(_){ return `<div class="muted small" style="color:#333;text-align:center;word-break:break-all">No se pudo dibujar el QR. Código: ${esc(texto)}</div>`; }
}

const EST = {presente:["Presente","ok","check"], tarde:["Tarde","warn","clock"], servicio:["Servicio","neutral","heart"], ausente:["Ausente","bad","x"]};

const pctAsis = a => { const base = a.total - (a.servicio||0); return base>0 ? Math.round(a.presentes/base*100) : null; };
function alertaRacha(racha, propio){
  if(racha>=3) return `<div class="estado bad">${I("alert")}<span>${propio?"Llevás":"Lleva"} ${racha} faltas seguidas.${propio?" Hablá con tu guía.":""}</span></div>`;

  return "";
}
function historialAsisHTML(a, propio){

    <div class="row"><div><div class="muted small">Asistencia</div><div class="bigpct num">${pc===null?"—":pc+"%"}</div></div>
      <div style="text-align:right;display:flex;flex-direction:column;gap:2px" class="small">

    <h3>Equipos <span class="muted small">(Alfa en el que sirvió y equipo)</span></h3><div class="list" id="fiEQ">${listaEq()}</div>
    <div class="grid2"><input id="fiEqAlfa" inputmode="numeric" placeholder="N° de Alfa"><input id="fiEqNom" placeholder="Equipo (ej.: Cocina)"></div>
    <div style="display:flex;gap:8px"><input id="fiEqFecha" type="date" aria-label="Fecha (opcional)" title="Fecha (opcional)"><button class="btn soft sm" type="button" data-agregar="eq">${I("plus","sm")} Agregar</button></div>
    <h3>Mensajes dados</h3><div class="list" id="fiMS">${listaMs()}</div>
    <input id="fiMsTema" placeholder="Tema del mensaje">
    <div class="grid2"><input id="fiMsFecha" type="date" aria-label="Fecha" title="Fecha"><input id="fiMsLugar" placeholder="Dónde (ej.: Alfa 46)"></div>
    <button class="btn soft sm" type="button" data-agregar="ms">${I("plus","sm")} Agregar mensaje</button>
    <h3>Cursos intensivos</h3><div class="list" id="fiCI">${listaEd("ci",ci)}</div>

  (s, cerrar)=>{
    const pintar = ()=>{ s.querySelector("#fiCI").innerHTML = listaEd("ci",ci); s.querySelector("#fiCE").innerHTML = listaEd("ce",ce);

      try{

        cerrar(); await recargar(); toast("Ficha guardada"); hojaFicha(f.id);
      }catch(e){ const er=s.querySelector("#fiErr"); er.textContent=e.message; er.hidden=false; }
    });
  });
}

async function cargarJsQR(){
  if(window.jsQR) return;
  await new Promise((res, rej)=>{ const sc=document.createElement("script"); sc.src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"; sc.onload=res; sc.onerror=()=>rej(new Error("No se pudo cargar el lector de QR")); document.head.appendChild(sc); });
}
let audioCtx;
function pip(ok){
  try{ navigator.vibrate && navigator.vibrate(ok?80:[60,60,60]); }catch(_){}
  try{ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.frequency.value = ok?880:220; g.gain.value=.08; o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+.12); }catch(_){}
}
function abrirEscaner(rid){
  const reu = S.reus.reuniones.find(r=>r.id===rid) || {nombre:"Reunión", fecha:"", presentes:0, esperados:0};
  let stream = null, vivo = true, ultimo = "", ultimoT = 0, ocupadoQR = false, detector = null;
  const cerrarHoja = abrirHoja(`<h2>${esc(reu.nombre)}</h2><div class="muted small">${reu.fecha} · Apuntá la cámara al QR de cada dirigente. Podés escanear uno tras otro.</div>
    <div class="scan" id="scanBox"><video id="scanVid" playsinline muted></video><div class="mira"></div></div>
    <div class="ultimo estado neutral" id="scanMsg">Iniciando cámara…</div>
    <div class="row"><span class="muted small">Presentes</span><b class="num" style="font-size:1.4rem" id="scanCnt">${reu.presentes} / ${reu.esperados}</b></div>
    <div class="actions"><button class="btn soft" id="scanLista">${I("users")} Marcar a mano</button><button class="btn" data-cerrar>${I("check")} Terminar</button></div>`,
  async (s)=>{
    const vid = s.querySelector("#scanVid"), box = s.querySelector("#scanBox"), msg = s.querySelector("#scanMsg"), cnt = s.querySelector("#scanCnt");
    s.querySelector("#scanLista").onclick = ()=>{ parar(); cerrarHoja(); abrirListaReunion(rid); };
    const aviso = (cls, txt) => { msg.className = "ultimo estado " + cls; msg.innerHTML = txt; box.classList.remove("ok","bad"); if(cls!=="neutral") box.classList.add(cls==="ok"?"ok":"bad"); };
    try{
      if(!navigator.mediaDevices?.getUserMedia) throw new Error("Este navegador no permite usar la cámara. Usá Marcar a mano.");
      stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}, audio:false});
      vid.srcObject = stream; await vid.play();
      if("BarcodeDetector" in window){ try{ detector = new BarcodeDetector({formats:["qr_code"]}); }catch(_){ detector = null; } }
      if(!detector) await cargarJsQR();
      aviso("neutral", "Listo: mostrá un QR");
    }catch(e){
      aviso("bad", esc(e.name==="NotAllowedError" ? "Permití el uso de la cámara en el navegador (ícono del candado, arriba) o usá Marcar a mano." : e.message)); return;
    }
    const cv = document.createElement("canvas"), cx = cv.getContext("2d", {willReadFrequently:true});
    const leer = async () => {
      if(!vivo) return;
      if(!ocupadoQR && vid.readyState >= 2){
        let txt = null;
        try{
          if(detector){ const r = await detector.detect(vid); if(r[0]) txt = r[0].rawValue; }
          else { const w = 480, h = Math.round(vid.videoHeight / vid.videoWidth * w) || 480; cv.width = w; cv.height = h; cx.drawImage(vid, 0, 0, w, h);
            const img = cx.getImageData(0, 0, w, h); const r = jsQR(img.data, w, h, {inversionAttempts:"dontInvert"}); if(r) txt = r.data; }
        }catch(_){}
        const ahora = Date.now();
        if(txt && !(txt===ultimo && ahora-ultimoT<3000)){
          ultimo = txt; ultimoT = ahora; ocupadoQR = true;
          try{ const r = await rpc("registrar_qr",{p_codigo:S.codigo,p_reunion:rid,p_qr:txt});
            pip(true); aviso(r.estado==="tarde"?"bad":"ok", `${I(r.estado==="tarde"?"clock":"check","sm")} ${esc(r.nombre)} ${r.nuevo?(r.estado==="tarde"?"llegó tarde":"presente"):"ya estaba registrado ("+EST[r.estado][0].toLowerCase()+")"}`); cnt.textContent = `${r.presentes} / ${reu.esperados}`;
          }catch(e){ pip(false); aviso("bad", esc(e.message)); }
          ocupadoQR = false;
        }
      }
      setTimeout(leer, 160);
    };
    leer();
  });
  function parar(){ vivo = false; if(stream) stream.getTracks().forEach(t=>t.stop()); }
  const obs = new MutationObserver(()=>{ if(!document.getElementById("scanBox")){ parar(); obs.disconnect(); recargar().catch(()=>{}); } });
  obs.observe($("sheetRoot"), {childList:true, subtree:true});
}
async function abrirListaReunion(rid){
  let d;

  const cuenta = () => { const c = {presente:0,tarde:0,servicio:0,ausente:0}; d.dirigentes.forEach(x=>c[x.estado]++); return c; };
  const pl = (n, uno, varios) => `${n} ${n===1?uno:varios}`;
  const resumen = () => { const c = cuenta(); return `${pl(c.presente+c.tarde,"presente","presentes")}${c.tarde?` (${c.tarde} tarde)`:""} · ${c.servicio} de servicio · ${pl(c.ausente,"ausente","ausentes")}`; };
  abrirHoja(`<h2>${esc(d.nombre)}</h2><div class="muted small">${d.fecha} · ${esc(d.tipo)}${d.hora_inicio?` · ${d.hora_inicio} h`:""}. Elegí el estado de cada dirigente.</div>
    <div class="estado neutral small" id="lRes">${resumen()}</div>
    <div class="list" id="lLista">${d.dirigentes.map(x=>`<div class="item" style="flex-wrap:wrap"><div class="l"><div class="t">${esc(x.nombre)}</div>

      <select data-m="${x.id}" ${S.reus?.puede_tomar===false?"disabled":""} style="width:auto;min-width:130px;padding:8px">${Object.keys(EST).map(k=>`<option value="${k}" ${x.estado===k?"selected":""}>${EST[k][0]}</option>`).join("")}</select></div>`).join("")}</div>
    <div class="actions">${S.reus?.puede_tomar===false?"":`<button class="btn soft" id="lEsc">${I("check")} Volver al escáner</button>`}<button class="btn" data-cerrar>Listo</button></div>`,
  (s, cerrar)=>{

    s.querySelector("#lLista").onchange = async ev => {

        it.estado = sel.value; s.querySelector(`[data-info="${it.id}"]`).textContent = sel.value==="ausente" ? "Sin registro" : "A mano · ahora";
        s.querySelector("#lRes").textContent = resumen();

      sel.disabled = false;
    };
  });
  const obs = new MutationObserver(()=>{ if(!document.getElementById("lLista")){ obs.disconnect(); if(!document.getElementById("scanBox")) recargar().catch(()=>{}); } });
  obs.observe($("sheetRoot"), {childList:true, subtree:true});
}

// ===== Código para la planilla de Drive =====
function scriptDrive(token){
  return `// Libro diario de la tesorería: se actualiza solo cada hora.
const API = "${SUPABASE_URL}/rest/v1/rpc/libro_hoja";
const KEY = "${SUPABASE_KEY}";
const TOKEN = "${token}";

function instalar() {
  ScriptApp.getProjectTriggers().forEach(t => ScriptApp.deleteTrigger(t));
  ScriptApp.newTrigger("actualizar").timeBased().everyHours(1).create();
  actualizar();
}

function actualizar() {
  const r = UrlFetchApp.fetch(API, { method: "post", contentType: "application/json",
    headers: { apikey: KEY }, payload: JSON.stringify({ p_token: TOKEN }), muteHttpExceptions: true });
  if (r.getResponseCode() !== 200) throw new Error("No se pudo leer la app: " + r.getContentText());
  const d = JSON.parse(r.getContentText());
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  const fecha = s => { const [dd, mm, aa] = s.split("/").map(Number); return new Date(aa, mm - 1, dd); };
  const n = x => Number(x) || 0;

  escribir(ss, "Libro diario",
    ["Fecha", "Tipo", "N°", "Concepto", "Detalle", "Medio", "Tesorero", "Ingreso", "Gasto", "Saldo"],
    d.libro.map(x => [fecha(x.fecha), x.tipo, x.nro, x.concepto, x.detalle, x.medio, x.tesorero,
      n(x.ingreso) || "", n(x.egreso) || "", n(x.saldo)]), [8, 9, 10], 1);

  escribir(ss, "Por evento",
    ["Evento", "Unidades", "Vendido", "Cobrado", "Falta cobrar", "Gastos", "Resultado (cobrado - gastos)"],
    d.eventos.filter(e => n(e.vendido) || n(e.gastos)).map(e => [e.nombre, n(e.unidades), n(e.vendido), n(e.cobrado),
      n(e.vendido) - n(e.cobrado), n(e.gastos), n(e.cobrado) - n(e.gastos)]), [3, 4, 5, 6, 7], 0);

  const meses = {};
  d.libro.forEach(x => { const f = fecha(x.fecha); const k = f.getFullYear() + "-" + String(f.getMonth() + 1).padStart(2, "0");
    meses[k] = meses[k] || [0, 0]; meses[k][0] += n(x.ingreso); meses[k][1] += n(x.egreso); });
  escribir(ss, "Por mes", ["Mes", "Ingresos", "Gastos", "Resultado"],
    Object.keys(meses).sort().map(k => [k, meses[k][0], meses[k][1], meses[k][0] - meses[k][1]]), [2, 3, 4], 0);

  ss.getSheetByName("Libro diario").getRange("L1").setValue(d.parroquia + " · actualizado " + d.actualizado);
}

function escribir(ss, nombre, enc, filas, colsPlata, colFecha) {
  const h = ss.getSheetByName(nombre) || ss.insertSheet(nombre);
  h.clearContents();
  h.getRange(1, 1, 1, enc.length).setValues([enc]).setFontWeight("bold").setBackground("#E6EBFB");
  h.setFrozenRows(1);
  if (!filas.length) return;
  h.getRange(2, 1, filas.length, enc.length).setValues(filas);
  colsPlata.forEach(c => h.getRange(2, c, filas.length, 1).setNumberFormat('"$" #,##0;[Red]-"$" #,##0'));
  if (colFecha) h.getRange(2, colFecha, filas.length, 1).setNumberFormat("dd/mm/yyyy");
  h.autoResizeColumns(1, enc.length);
}
`;
}

function hojaLink(nombre, celular, codigo, esTesorero, esAutoridad){

  const mc = m.querySelector("[data-mi-cuenta]"); if(mc) mc.onclick = ()=>{ S.tab = "yo"; render(); scrollTo({top:0}); };
  m.onclick = async e => {
    const b = e.target.closest("button,[data-mem]"); if(!b) return;
    const ds = b.dataset;
    if(ds.tabgo){ S.tab=ds.tabgo; render(); return; }
    if(ds.ver) return ocupado(b, async()=>{ try{ const {url} = await fnComprobantes({accion:"ver",codigo:S.codigo,pago_id:Number(ds.ver)});
        const a=document.createElement("a"); a.href=url; a.target="_blank"; a.rel="noopener"; a.className="btn soft sm"; a.innerHTML=`${I("file","sm")} Abrir ↗`; b.replaceWith(a); a.click(); }catch(er){ toast(er.message) } });
    if(ds.ok) return ocupado(b, async()=>{ try{ const r = await rpc("verificar_pago",{p_codigo:S.codigo,p_pago:Number(ds.ok),p_aprobar:true}); await recargar(); hojaRecibo(r); }catch(er){ toast(er.message) } });
    if(ds.no){ if(!await confirmar("¿Rechazar el comprobante?","El pago no se suma a la cuenta del dirigente. Avisale por qué lo rechazaste.","Rechazar")) return;
      return ocupado(b, async()=>{ try{ await rpc("verificar_pago",{p_codigo:S.codigo,p_pago:Number(ds.no),p_aprobar:false}); await recargar(); toast("Comprobante rechazado"); }catch(er){ toast(er.message) } }); }
    if(ds.filtro){ S.filtro=ds.filtro; render(); return; }
    if(ds.sub){ S.sub=ds.sub; render(); scrollTo({top:0}); return; }
    if(ds.reenviar) return ocupado(b, async()=>{ try{ await rpc("reenviar_recibo",{p_codigo:S.codigo,p_pago:Number(ds.reenviar)}); toast("Recibo reenviado por mail"); }catch(er){ toast(er.message) } });
    if(ds.mem!==undefined && b.classList.contains("mem")) return abrirDetalle(b);
    // Gestión
    const P = S.panel;
    if(ds.nuevoTes!==undefined) return hojaTesorero(null);
    if(ds.editTes) return hojaTesorero(P.tesoreros.find(x=>x.id==ds.editTes));
    if(ds.asig) return hojaAsignar(P.tesoreros.find(x=>x.id==ds.asig));
    if(ds.linkTes){ const t=P.tesoreros.find(x=>x.id==ds.linkTes); return hojaLink(t.nombre,t.celular,t.codigo,true); }
    if(ds.bajaTes){ const t=P.tesoreros.find(x=>x.id==ds.bajaTes), act = ds.activo==="true";
      if(act && !await confirmar(`¿Dar de baja a ${t.nombre}?`, `Su código deja de funcionar y sus ${t.miembros} dirigentes quedan sin tesorero hasta que los asignes a otro.`, "Dar de baja")) return;
      return ocupado(b, async()=>{ try{ const r=await rpc("set_tesorero_activo",{p_codigo:S.codigo,p_id:t.id,p_activo:!act}); await recargar(); toast(act?`Dado de baja. ${r.liberados} dirigentes quedaron sin tesorero.`:"Reactivado"); }catch(er){ toast(er.message) } }); }
    if(ds.asisPerm){ const tiene = ds.tiene==="true", t=P.tesoreros.find(x=>x.id==ds.asisPerm);
      return ocupado(b, async()=>{ try{ await rpc("set_puede_asistencia",{p_codigo:S.codigo,p_id:t.id,p_valor:!tiene}); await recargar(); toast(tiene?"Permiso quitado":`${t.nombre} ya puede tomar asistencia`); }catch(er){ toast(er.message) } }); }
    if(ds.ficha) return hojaFicha(Number(ds.ficha));
    if(ds.verQr){ const x=P.miembros.find(y=>y.id==ds.verQr);
      return ocupado(b, async()=>{ try{ const q = await rpc("qr_de",{p_codigo:S.codigo,p_miembro:x.id});
        abrirHoja(`<h2>QR de ${esc(x.nombre)}</h2><div class="qrbox">${qrSVG(q)}</div><div class="muted small">Es fijo: no cambia nunca. Sirve para tomarle asistencia si no tiene el celular.</div><button class="btn" data-dl-qr>${I("upload")} Guardar como imagen</button><button class="btn soft" data-cerrar>Cerrar</button>`,
          (sh)=>{ const d = sh.querySelector("[data-dl-qr]"); d.onclick = ()=> ocupado(d, ()=>guardarQR(q, x.nombre)); });
      }catch(er){ toast(er.message) } }); }
    if(ds.kioscoPerm){ const tiene = ds.tiene==="true", t=P.tesoreros.find(x=>x.id==ds.kioscoPerm);
      return ocupado(b, async()=>{ try{ await rpc("set_puede_kiosco",{p_codigo:S.codigo,p_id:t.id,p_valor:!tiene}); await recargar(); toast(tiene?"Permiso quitado":`${t.nombre} ya puede manejar el kiosco`); }catch(er){ toast(er.message) } }); }
    if(ds.nuevaAut!==undefined) return hojaAutoridad(null);
    if(ds.editAut) return hojaAutoridad(P.tesoreros.find(x=>x.id==ds.editAut));
    if(ds.linkAut){ const t=P.tesoreros.find(x=>x.id==ds.linkAut); return hojaLink(t.nombre,t.celular,t.codigo,true,true); }
    if(ds.gastoPerm){ const tiene = ds.tiene==="true", t=P.tesoreros.find(x=>x.id==ds.gastoPerm);
      if(!tiene && !await confirmar(`¿Permitir que ${t.nombre} cargue gastos?`, "Va a poder cargar gastos y anular los que cargue. Los demás tesoreros los ven, pero no pueden cargar.", "Permitir", "")) return;
      return ocupado(b, async()=>{ try{ await rpc("set_puede_gastar",{p_codigo:S.codigo,p_id:t.id,p_valor:!tiene}); await recargar(); toast(tiene?"Permiso quitado":`${t.nombre} ya puede cargar gastos`); }catch(er){ toast(er.message) } }); }
    if(ds.nuevoMem!==undefined) return hojaMiembro(null);
    if(ds.editMem) return hojaMiembro(P.miembros.find(x=>x.id==ds.editMem));
    if(ds.linkMem){ const x=P.miembros.find(y=>y.id==ds.linkMem); return hojaLink(x.nombre,x.celular,x.codigo,false); }
    if(ds.bajaMem){ const x=P.miembros.find(y=>y.id==ds.bajaMem), act = ds.activo==="true";
      if(act && !await confirmar(`¿Dar de baja a ${x.nombre}?`, "Deja de aparecer en las listas, no recibe recordatorios y su link deja de funcionar. Su historial se guarda y lo podés reactivar.", "Dar de baja")) return;
      return ocupado(b, async()=>{ try{ await rpc("set_miembro_activo",{p_codigo:S.codigo,p_id:x.id,p_activo:!act}); await recargar(); toast(act?"Dirigente dado de baja":"Dirigente reactivado"); }catch(er){ toast(er.message) } }); }
    if(ds.nuevoEv!==undefined) return hojaEvento(null);
    if(ds.editEv) return hojaEvento(P.eventos.find(x=>x.id==ds.editEv));
    if(ds.bajaEv){ const act = ds.activo==="true";
      return ocupado(b, async()=>{ try{ await rpc("set_evento_activo",{p_codigo:S.codigo,p_id:Number(ds.bajaEv),p_activo:!act}); await recargar(); toast(act?"Evento cerrado: ya no se puede entregar":"Evento reabierto"); }catch(er){ toast(er.message) } }); }
  };
  m.onchange = async e => {
    const sel = e.target.closest("[data-cambiar-tes]"); if(!sel) return;
    try{ await rpc("asignar_tesorero",{p_codigo:S.codigo,p_miembro:Number(sel.dataset.cambiarTes),p_tesorero:sel.value?Number(sel.value):null}); await recargar(); toast("Tesorero asignado"); }catch(er){ toast(er.message) }
  };
  const busca = $("busca");
  if(busca){ busca.oninput = ()=>{ S.busca = busca.value; const pos = busca.selectionStart; render(); const nb=$("busca"); nb.focus(); nb.setSelectionRange(pos,pos); }; }
  if($("aEvento")){ $("aEvento").onchange=calcTotal; $("aCant").oninput=calcTotal; calcTotal(); }
  if($("eGuardar")) $("eGuardar").onclick = () => ocupado($("eGuardar"), async ()=>{
    const monto = Number($("eMonto").value); if(!(monto>0)){ toast("Escribí el monto recibido"); return; }
    try{ const r = await rpc("registrar_efectivo",{p_codigo:S.codigo,p_miembro:Number($("eMiembro").value),p_evento:$("eConcepto").value?Number($("eConcepto").value):null,p_monto:monto});
      await recargar(); hojaRecibo(r); }catch(er){ toast(er.message) }
  });
  if($("aGuardar")) $("aGuardar").onclick = () => ocupado($("aGuardar"), async ()=>{
    const cant = Number($("aCant").value); if(!(cant>0)){ toast("Escribí una cantidad"); return; }
    const nom = $("aMiembro").selectedOptions[0]?.textContent || "";
    try{ await rpc("asignar_evento",{p_codigo:S.codigo,p_miembro:Number($("aMiembro").value),p_evento:Number($("aEvento").value),p_cantidad:cant}); await recargar(); toast(`Asignado a ${nom}`); }catch(er){ toast(er.message) }
  });
  if($("btnProbar")) $("btnProbar").onclick = () => ocupado($("btnProbar"), async ()=>{
    try{ await rpc("probar_mail",{p_codigo:S.codigo,p_destino:$("mailPrueba").value}); toast("Prueba enviada. Revisá tu casilla (y spam) en un minuto."); }catch(er){ toast(er.message) }
  });
  if($("btnRecordar")) $("btnRecordar").onclick = async () => {
    if(!await confirmar("¿Enviar recordatorio ahora?","A cada dirigente que debe le llega un mail con su estado de cuenta. Además, esto sale solo los días 1 y 16 de cada mes.","Enviar","")) return;
    ocupado($("btnRecordar"), async ()=>{ try{ const r = await rpc("enviar_recordatorios_ahora",{p_codigo:S.codigo}); toast(`Se están enviando ${r.encolados} recordatorios`); }catch(er){ toast(er.message) } });
  };
  if($("btnHist")) $("btnHist").onclick = () => ocupado($("btnHist"), async ()=>{
    try{ const ns = await rpc("notificaciones_recientes",{p_codigo:S.codigo}); const box=$("histMails"); box.hidden=false;
      const est = {enviado:'<span class="pill ok">Enviado</span>', pendiente:'<span class="pill warn">Enviando</span>', error:'<span class="pill bad">Error</span>', sin_mail:'<span class="pill off">Sin mail</span>'};
      const tipo = {recibo:"Recibo", recordatorio:"Recordatorio", prueba:"Prueba"};
      box.innerHTML = ns.length ? ns.map(n=>`<div class="item"><div class="ic">${I("mail")}</div><div class="l"><div class="t">${tipo[n.tipo]} · ${esc(n.miembro||n.destino||"")}</div>
        <div class="muted small">${n.fecha}${n.destino?` · ${esc(n.destino)}`:""}${n.detalle?` · ${esc(n.detalle)}`:""}</div></div>${est[n.estado]}</div>`).join("") : `<div class="muted small">Todavía no se envió ningún mail.</div>`;
    }catch(er){ toast(er.message) } });
  if($("btnTraspaso")) $("btnTraspaso").onclick = async () => {
    const sel = $("nuevoGuia"); if(!sel.value){ toast("Primero creá o elegí otro tesorero"); return; }
    const nombre = sel.selectedOptions[0].textContent;
    if(!await confirmar(`¿Pasarle el rol de guía a ${nombre}?`, `${esc(nombre)} va a poder ver y gestionar todo. Vos vas a quedar como tesorero común y ya no vas a ver la gestión. No se puede deshacer desde tu cuenta.`, "Pasar el rol")) return;
    ocupado($("btnTraspaso"), async ()=>{
      try{ const r = await rpc("traspasar_guia",{p_codigo:S.codigo,p_nuevo:Number(sel.value)});
        const link = linkPersonal(r.codigo);
        const msg = `Hola ${primer(r.nuevo_guia)}, desde ahora sos el guía del área en la app de aportes. Tu acceso (no lo compartas):\n${link}`;
        await recargar(); S.tab="inicio"; render();
        abrirHoja(`<div class="estado ok">${I("check")}<span>${esc(r.nuevo_guia)} es el nuevo guía</span></div>
          <div class="muted small">Mandale su acceso. Desde su cuenta va a ver la pestaña Gestión.</div>
          <div class="receipt" style="word-break:break-all">${esc(link)}</div>
          ${r.celular?`<a class="btn wa" target="_blank" rel="noopener" href="${waLink(r.celular,msg)}">${I("msg")} Enviar por WhatsApp</a>`:""}
          <button class="btn ghost" data-cerrar>Cerrar</button>`);
      }catch(er){ toast(er.message) }
    });
  };
}
async function abrirDetalle(b){
  const det = b.parentElement.querySelector("[data-det]");
  if(!det.hidden){ det.hidden = true; b.setAttribute("aria-expanded","false"); return; }
  det.hidden = false; b.setAttribute("aria-expanded","true");
  det.innerHTML = `<div class="muted small">Cargando…</div>`;
  try{
    const c = await rpc("cuenta_de",{p_codigo:S.codigo,p_miembro:Number(b.dataset.mem)});
    det.innerHTML = `
      ${aporteHTML(c.aporte, false)}
      <h3>Por concepto · debe hoy <span class="debt num">${fmt(c.saldo)}</span></h3>
      <div class="list">${conceptosHTML(c.conceptos)}</div>
      <h3>Historial de pagos</h3>
      <div class="list">${pagosHTML(c.pagos, true)}</div>
      <h3>Asistencia</h3>
      <div data-asis-det style="display:flex;flex-direction:column;gap:10px"><div class="muted small">Cargando…</div></div>
      <div class="actions"><button class="btn soft sm" data-link-det>${I("msg","sm")} Enviarle su link</button><button class="btn soft sm" data-ficha-det>${I("users","sm")} Ver ficha</button></div>`;
    det.querySelector("[data-ficha-det]").onclick = ev => { ev.stopPropagation(); hojaFicha(Number(b.dataset.mem)); };
    rpc("asistencia_de",{p_codigo:S.codigo,p_miembro:Number(b.dataset.mem)}).then(a=>{ const box = det.querySelector("[data-asis-det]"); if(box) box.innerHTML = historialAsisHTML(a, false); })
      .catch(()=>{ const box = det.querySelector("[data-asis-det]"); if(box) box.innerHTML = `<div class="muted small">No se pudo cargar la asistencia.</div>`; });
    det.querySelector("[data-link-det]").onclick = (ev) => { ev.stopPropagation();
      const link = linkPersonal(c.miembro.codigo);
      const msg = `Hola ${primer(c.miembro.nombre)}, este es tu link personal para ver tu cuenta de aportes y subir comprobantes. No lo compartas:\n${link}`;
      abrirHoja(`<h2>Link de ${esc(c.miembro.nombre)}</h2><div class="receipt" style="word-break:break-all">${esc(link)}</div>
        <div class="actions">${c.miembro.celular?`<a class="btn wa" target="_blank" rel="noopener" href="${waLink(c.miembro.celular,msg)}">${I("msg")} Enviar por WhatsApp</a>`:""}<button class="btn soft" data-cerrar>Cerrar</button></div>`);
    };
  }catch(err){ det.innerHTML = `<div class="err">${esc(err.message)}</div>`; }
}

// ===== Inicio =====
$("btnEntrar").onclick = async ()=>{
  const c=$("inCodigo").value.trim(); if(!c) return; $("loginErr").hidden=true;
  if(/^[\d.\s-]+$/.test(c)){
    try{ const cod = await rpc("codigo_por_dni",{p_dni:c}); entrar(cod); }
    catch(e){ $("loginErr").textContent = e.message; $("loginErr").hidden = false; }
  } else entrar(c);
};
$("inCodigo").onkeydown = e => { if(e.key==="Enter") $("btnEntrar").click(); };
function paginaKiosco(){
  $("tabs").hidden = true; for(const v of ["vCargando","vLogin"]) $(v).hidden = true; $("vMain").hidden = false;
  $("vMain").innerHTML = `<div class="login" style="min-height:auto;padding-top:20px">
    <div class="logo">${I("cash")}</div><h1>Kiosco · enviá tu comprobante</h1>
    <div class="muted">Si pagaste por transferencia, cargá el monto y la foto del comprobante. Gracias por colaborar.</div></div>
    <div class="card" id="kpForm">
      <label>Tu nombre y apellido<input id="kpNom" autocomplete="name" required placeholder="Ej.: Carlos Pérez"></label>
      <label>Monto que transferiste ($)<input id="kpMonto" type="number" inputmode="numeric" min="1"></label>
      <label>¿Qué compraste? (opcional)<input id="kpDet" placeholder="Ej.: Pancho y gaseosa"></label>
      <label class="file" id="kpBox">${I("upload")}<span id="kpTxt"><b>Tocá para elegir el comprobante</b><br><span class="small">Foto o PDF</span></span>
        <input id="kpFile" type="file" accept="image/*,application/pdf"></label>
      <div class="err" id="kpErr" hidden></div>
      <button class="btn block" id="kpOk">${I("send")} Enviar comprobante</button>
    </div>
    <div class="card" id="kpGracias" hidden style="align-items:center;text-align:center"><div class="ic ok" style="width:56px;height:56px">${I("check")}</div>
      <h2>¡Listo, gracias!</h2><div class="muted">Recibimos tu comprobante.</div><button class="btn soft" id="kpOtro">Enviar otro</button></div>`;
  const f = $("kpFile");
  f.onchange = ()=>{ const x=f.files[0]; $("kpBox").classList.toggle("has",!!x); $("kpTxt").innerHTML = x?`<b>${esc(x.name)}</b>`:"<b>Tocá para elegir el comprobante</b>"; };
  $("kpOtro").onclick = ()=>{ $("kpGracias").hidden = true; $("kpForm").hidden = false; ["kpMonto","kpDet"].forEach(i=>$(i).value=""); f.value=""; f.onchange(); };
  $("kpOk").onclick = () => ocupado($("kpOk"), async()=>{
    $("kpErr").hidden = true;
    try{ const monto = Number($("kpMonto").value); let x = f.files[0];
      if($("kpNom").value.trim().length < 2) throw new Error("Escribí tu nombre y apellido.");
      if(!(monto>0)) throw new Error("Escribí el monto que transferiste.");
      if(!x) throw new Error("Elegí la foto o el PDF del comprobante.");
      x = await comprimir(x);
      const fd = new FormData(); fd.append("tipo","kiosco"); fd.append("monto",String(monto)); fd.append("comprador",$("kpNom").value); fd.append("detalle",$("kpDet").value); fd.append("archivo",x);
      await fnComprobantes(fd); $("kpForm").hidden = true; $("kpGracias").hidden = false;
    }catch(e){ $("kpErr").textContent = e.message; $("kpErr").hidden = false; }
  });
}
const desdeLink = new URLSearchParams(location.search).get("c");
const inicial = desdeLink || read("aportes_codigo");
if(new URLSearchParams(location.search).has("kiosco")) paginaKiosco();
else if(inicial) entrar(inicial); else mostrar("vLogin");
</script>
